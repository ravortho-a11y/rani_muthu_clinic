{% extends 'base.html' %}
{% block title %}Book Appointment | Ranimuthu Clinic{% endblock %}
{% block content %}
<section class="form-section"><div class="container form-layout"><div class="form-side"><span class="eyebrow">ONLINE BOOKING</span><h1>Book your appointment</h1><p>Choose a service, date and time. You will then be taken to the payment-reference page.</p><div class="mini-doctor"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="Clinic logo"><div><b>{{ doctor.name }}</b><small>{{ doctor.specialty }}</small></div></div></div><div class="form-card"><form method="post"><label>Service</label><select name="service_id" required>{% for s in fee_rows %}<option value="{{ s.id }}">{{ s.name }} — ₹{{ s.fee }}</option>{% endfor %}</select><label>Date</label><input type="date" name="appointment_date" min="{{ now_date }}" required><label>Time</label><input type="time" name="appointment_time" required><label>Reason for visit</label><textarea name="reason" rows="4" placeholder="Briefly describe the reason for your visit"></textarea><button class="btn primary full" type="submit">Continue to Payment →</button></form></div></div></section>
{% endblock %}
